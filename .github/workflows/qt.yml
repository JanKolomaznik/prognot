name: Qt
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Qt 6.8.3 / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-boost
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure Qt and examples
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DPROGNOT_BUILD_QT=ON
          -DPROGNOT_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and Qt widgets
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prognot-install"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-tests-${{ matrix.build_type }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          retention-days: 14
